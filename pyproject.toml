[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autopaper"
version = "0.2.1"
description = "Read paper input folders and create per-run output directories"
readme = "README.MD"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Auto-Paper contributors" }]
dependencies = [
    "google-genai>=1.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
autopaper = "autopaper.main.app:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["autopaper*", "input*"]

[tool.setuptools.package-data]
input = ["prompts/**/*.md"]
autopaper = ["flow/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
