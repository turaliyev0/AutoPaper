[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autopaper"
version = "0.3.0"
description = "Paper input rendering and multi-agent research pipelines"
readme = "README.MD"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Auto-Paper contributors" }]
dependencies = [
    "google-genai>=1.0.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "openai>=1.40.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
autopaper = "autopaper.main.app:main"
research = "pipeline.research.main:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["autopaper*", "pipeline*"]

[tool.setuptools.package-data]
"pipeline.input" = ["prompts/**/*.md"]
"pipeline.research" = ["prompts/**/*.md"]
"pipeline.editor" = ["prompts/**/*.md"]
autopaper = ["flow/**/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
