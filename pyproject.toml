[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autopaper"
version = "0.2.0"
description = "Read paper input folders and create per-run output directories"
readme = "README.MD"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Auto-Paper contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
autopaper = "autopaper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["input"]
python_files = ["input_*.py"]
python_functions = ["input_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
